[package]
name = "uiprobe"
version = "0.18.8"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository.workspace = true
description = "Headless UI harness for Slint apps: invariant sweep, click-everything smoke, coverage gate, isolated profile"
keywords = ["slint", "testing", "gui", "harness"]
categories = ["development-tools::testing", "gui"]

# docs.rs builds with default features only unless told otherwise; the screenshot and recording
# modules (and `Renderer::Software`) are behind features.
[package.metadata.docs.rs]
all-features = true

[dependencies]
slint = { workspace = true, features = ["std", "compat-1-18"] }
i-slint-backend-testing = { workspace = true }
uiprobe-hooks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
png = { workspace = true, optional = true }

[features]
# Window screenshots: `Harness::renderer(Renderer::Software)` draws the windows with Slint's
# software renderer and the `screenshot` module captures, crops and saves them as PNG. Off by
# default: the mock renderer is faster and machine independent.
screenshots = ["dep:png", "i-slint-backend-testing/renderer-software"]

# Video recording: the `recording` module plays the app frame by frame (software renderer), draws
# a mouse cursor and click ripples over the pictures and pipes them to ffmpeg (MP4, captions,
# chapters). Needs ffmpeg at run time, not at build time.
recording = ["screenshots"]

# Every self-test is its own process: the testing backend can be initialised once per process,
# and the harness owns `main` (panic hook, exit code). `cargo test` runs each with exit code 0
# expected.
[[test]]
name = "scrolled_out"
harness = false

[[test]]
name = "modal"
harness = false

[[test]]
name = "overlap"
harness = false

[[test]]
name = "labels"
harness = false

[[test]]
name = "invisible"
harness = false

[[test]]
name = "coverage"
harness = false

[[test]]
name = "profile"
harness = false

[[test]]
name = "duplicate_label"
harness = false

[[test]]
name = "smoke_restore"
harness = false

[[test]]
name = "bounds"
harness = false

[[test]]
name = "smoke_findings"
harness = false

[[test]]
name = "runner"
harness = false

[[test]]
name = "parallel"
harness = false

[[test]]
name = "floating_layers"
harness = false

[[test]]
name = "smoke_scope"
harness = false

[[test]]
name = "coverage_matching"
harness = false

[[test]]
name = "screenshots"
harness = false
required-features = ["screenshots"]

[[test]]
name = "recording"
harness = false
required-features = ["recording"]

[[test]]
name = "targeting"
harness = false

[lints]
workspace = true
